<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Маргарита Анисько — Продуктовый и UX/UI дизайнер</title>
  <link rel="stylesheet" href="colors_and_type.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scroll-padding-top: var(--header-h); }
    body {
      background: var(--white);
      color: var(--ink-900);
      font: 400 16px/24px var(--font-body);
    }
    /* Main two-column shell: fixed 320 rail + flexible content. */
    main {
      margin-left: var(--rail-w);
      padding-top: var(--header-h);
    }

    /* ============================================================
       Side rail — desktop (≥1024): fixed 320 px vertical column.
       Below 1024 px it flips to a horizontal sticky strip (see media).
       ============================================================ */
    .side-rail {
      position: fixed;
      left: 0;
      top: var(--header-h);
      bottom: 0;
      width: var(--rail-w);
      border-right: 1px solid var(--border);
      padding: 48px 32px 0 32px;
      background: var(--white);
      z-index: 40;
      box-sizing: border-box;
    }
    .side-rail-nav {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .side-rail-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 10px 0;
      text-decoration: none;
      color: var(--ink-300);
      font: 500 20px/28px var(--font-body);
      cursor: pointer;
      transition: color .15s ease;
      flex-shrink: 0;
    }
    .side-rail-item.is-active { color: var(--ink-900); }
    .side-rail-item:not(.is-active):hover { color: var(--ink-900); }

    /* Three breakpoints mirror the Figma frames: 1440 / 1920 / 2560.
       The content column itself is either 1056 (≤1919) or 1360 (≥1920) wide.
       Vertical padding tightens at the small breakpoint (128 → 64). */
    .content {
      max-width: 1360px;
      margin: 0 auto;
      padding: 128px 32px;
      display: flex;
      flex-direction: column;
      gap: 128px;
    }
    @media (max-width: 1919px) {
      .content { max-width: 1056px; padding: 64px 32px; gap: 96px; }
    }
    @media (max-width: 1439px) {
      .content { padding: 48px 24px; gap: 80px; }
    }
    .section { display: flex; flex-direction: column; gap: 48px; }
    .section-heading h1, .section-heading h2.title {
      font: 500 48px/48px var(--font-display);
      color: var(--ink-900);
      margin: 0;
      letter-spacing: -0.01em;
    }
    .divider-solid {
      height: 1px;
      background: var(--border);
      border: none;
      margin: 0;
    }
    .divider-dashed {
      height: 0;
      border: none;
      border-top: 1px dashed var(--border);
      margin: 0;
    }
    /* Hero */
    .hero {
      display: flex;
      flex-direction: column;
      gap: 32px;
      align-items: center;
      text-align: center;
    }
    .hero h1 {
      max-width: 1200px;
      white-space: pre-line;
    }
    .hero p.sub {
      max-width: 800px;
      font: 400 20px/28px var(--font-body);
      color: var(--ink-600);
      margin: 0;
    }
    .hero .ctas {
      display: inline-flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 32px;
    }
    /* Cases */
    .cases-heading {
      display: flex;
      align-items: flex-end;
      gap: 32px;
      flex-wrap: wrap;
    }
    .cases-tabs {
      display: inline-flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      /* Tabs container claims remaining horizontal space so the count is
         pushed to the right edge of the heading. When tabs no longer fit
         on a single row inside the container, they wrap; the count stays
         bottom-right thanks to align-items: flex-end on .cases-heading. */
      flex: 1 1 auto;
      min-width: 0;
    }
    .cases-count {
      font: 400 16px/24px var(--font-body);
      color: var(--ink-400);
      flex-shrink: 0;
    }
    .cases-grid {
      display: grid;
      gap: 64px;
    }
    .cases-row-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
    }
    /* Reviews */
    .reviews-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .reviews-arrows { display: inline-flex; gap: 8px; }
    .arrow-btn {
      all: unset;
      width: 48px;
      height: 48px;
      border-radius: 9999px;
      border: 1px solid var(--ink-200);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink-900);
      background: var(--white);
      transition: border-color .15s ease, color .15s ease, opacity .15s ease;
      box-sizing: border-box;
    }
    .arrow-btn:hover:not(:disabled) { border-color: var(--ink-900); }
    .arrow-btn:disabled { color: var(--ink-200); cursor: not-allowed; }
    .arrow-btn svg { display: block; }
    /* Viewport + sliding track */
    .reviews-viewport { overflow: hidden; }
    .reviews-track {
      display: flex;
      transition: transform .4s cubic-bezier(.2,.6,.2,1);
    }
    .reviews-page {
      flex: 0 0 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .reviews-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .reviews-footer {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      font: 400 18px/26px var(--font-body);
      color: var(--ink-600);
    }
    /* Plain inline <a> links inside JSX components — match Button accent="text"
       hover behavior (turn accent-red on hover, ink-600 default with underline). */
    a.inline-link {
      color: var(--ink-600);
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color .15s ease;
    }
    a.inline-link:hover { color: var(--accent); }

    /* "Читать полностью" — text button under a clamped review quote.
       Behaves like the system's text button: ink-900 label, underlined,
       turns accent-red on hover. Left-aligned, sits flush. */
    .review-readmore {
      all: unset;
      align-self: flex-start;
      cursor: pointer;
      font: 400 18px/26px var(--font-body);
      color: var(--ink-900);
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-thickness: 1px;
      transition: color .15s ease;
    }
    .review-readmore:hover { color: var(--accent); }

    /* ============================================================
       REVIEW MODAL — full-text reader, opened from "Читать полностью".
       Square edges, no shadow, ink scrim + white panel. Quiet 150ms fade.
       ============================================================ */
    .review-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .review-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(13, 30, 44, 0.45);
      animation: review-fade .15s ease both;
    }
    .review-modal-panel {
      position: relative;
      width: min(640px, 100%);
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      background: var(--white);
      padding: 48px;
      display: flex;
      flex-direction: column;
      gap: 0;
      animation: review-rise .15s ease both;
    }
    .review-modal-close {
      all: unset;
      position: absolute;
      top: 24px;
      right: 24px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-400);
      transition: color .15s ease;
    }
    .review-modal-close svg { display: block; }
    .review-modal-close:hover { color: var(--ink-900); }
    .review-modal-quote {
      margin: 0 0 48px;
      font: 400 18px/26px var(--font-body);
      color: var(--ink-800);
      text-wrap: pretty;
    }
    .review-modal-author {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .review-modal-author h3 {
      margin: 0 0 12px;
      font: 400 24px/28px var(--font-display);
      color: var(--ink-900);
    }
    .review-modal-author span {
      font: 400 16px/24px var(--font-body);
      color: var(--ink-400);
    }
    @keyframes review-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes review-rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Background */
    .bg-grid {
      display: grid;
      grid-template-columns: 885fr 411fr;
      gap: 64px;
    }
    .bg-col {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    /* Experience */
    .exp-list {
      display: flex;
      flex-direction: column;
      gap: 64px;
    }
    /* Contacts */
    .contacts-grid {
      display: grid;
      grid-template-columns: 886fr 411fr;
      gap: 64px;
    }
    .contacts-buttons {
      display: inline-flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 32px;
    }
    .contacts-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: flex-start;
    }

    /* ============================================================
       MENU OVERLAY — hamburger-driven drawer for tablet & mobile.
       Hidden on desktop. The host (App) toggles visibility by
       mounting / unmounting MenuOverlay.
       ============================================================ */
    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 55;
      pointer-events: none;
    }
    .menu-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(13, 30, 44, 0.3);
      pointer-events: auto;
      animation: menuFade 160ms ease-out;
    }
    @keyframes menuFade { from { opacity: 0; } to { opacity: 1; } }
    .menu-panel {
      position: absolute;
      background: var(--white);
      pointer-events: auto;
      /* Tablet defaults — a 250 px popover floated below the header */
      top: calc(var(--header-h) + 16px);
      right: 32px;
      width: 250px;
      border-radius: 16px;
      box-shadow: 0 16px 40px -8px rgba(13, 30, 44, 0.16),
                  0 2px 6px rgba(13, 30, 44, 0.06);
      animation: menuPop 180ms cubic-bezier(.2,.7,.2,1);
    }
    @keyframes menuPop {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .menu-panel-inner {
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .menu-items {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .menu-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ink-300);
      font: 500 20px/28px var(--font-body);
      cursor: pointer;
      transition: color .15s ease;
    }
    .menu-item.is-active { color: var(--ink-900); }
    .menu-item:not(.is-active):hover { color: var(--ink-900); }
    .menu-divider {
      height: 1px;
      background: var(--border);
      border: none;
      margin: 0;
    }
    .menu-cta-block { display: none; flex-direction: column; gap: 20px; }
    .menu-cta-row { display: flex; gap: 16px; }

    /* ============================================================
       TABLET — viewport ≤ 1023 px
       Drop the desktop side rail and the in-header lang switch.
       Show the hamburger button. Content reclaims full width.
       Bэкграунд / Контакты grids collapse to a single column.
       Mirrors /Concept/728-tablet and /Concept/1024-tablet.
       ============================================================ */
    @media (max-width: 1023px) {
      main {
        margin-left: 0;
        padding-top: var(--header-h);
      }
      .side-rail { display: none; }
      .header-lang-switch, .header-divider { display: none !important; }
      .header-menu-btn { display: inline-flex !important; }

      /* Avatar shrinks from 180 → 135 on tablet. Inner rings scale via %. */
      .avatar { --avatar-size: 135px; }

      .content { max-width: 100%; padding: 64px 32px; gap: 80px; }

      /* Stack the 885/411 layouts */
      .bg-grid { grid-template-columns: 1fr; gap: 48px; }
      .contacts-grid { grid-template-columns: 1fr; gap: 48px; }
      .exp-grid { grid-template-columns: 1fr !important; gap: 48px !important; }

      /* ============================================================
         Item 3 — language switch fills the menu width on tablet & mobile.
         (Outer pill goes 100 % wide; the two segments share the row.)
         ============================================================ */
      .menu-lang { width: 100%; }
      .menu-lang .lang-switch {
        width: 100% !important;
        justify-content: stretch !important;
      }
      .menu-lang .lang-switch-seg {
        flex: 1 !important;
        width: auto !important;
      }
    }

    /* ============================================================
       MOBILE — viewport ≤ 727 px
       Header drops CV / Copy email — they live inside the menu now.
       Menu panel becomes a fullscreen sheet under the header.
       Type sizes step down per /Concept/375-mobile.
       ============================================================ */
    @media (max-width: 727px) {
      .content { padding: 32px 24px; gap: 48px; }
      .section { gap: 32px; }

      /* ============================================================
         Item 1 — header height shrinks to 64 on mobile.
         Cascades into main padding-top, side-rail offset, menu top.
         ============================================================ */
      :root { --header-h: 64px; }

      /* ============================================================
         Item 2 — header time + timezone → Inter 500, 14 / 22 px on mobile
         ============================================================ */
      .header-time, .header-tz {
        font: 500 14px/22px var(--font-body) !important;
        width: auto !important;
      }

      /* Header — drop the desktop CTAs, hamburger only */
      .site-header { padding: 0 24px !important; }
      .header-buttons { display: none !important; }

      /* Menu becomes fullscreen */
      .menu-backdrop { display: none; }
      .menu-panel {
        top: var(--header-h);
        right: 0;
        left: 0;
        bottom: 0;
        width: auto;
        border-radius: 0;
        box-shadow: none;
        animation: menuSlide 200ms cubic-bezier(.2,.7,.2,1);
        display: flex;
        flex-direction: column;
      }
      @keyframes menuSlide {
        from { opacity: 0; transform: translateY(-12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .menu-panel-inner {
        padding: 24px;
        gap: 32px;
        flex: 1;
        justify-content: space-between;
      }
      .menu-items { gap: 20px; }
      .menu-cta-block { display: flex; }
      .menu-lang { display: flex; justify-content: stretch; }
      .menu-lang > * { width: 100%; }

      /* Avatar shrinks further on mobile — 100×100 outer. */
      .avatar { --avatar-size: 100px; }

      /* Hero scales down */
      .hero { gap: 24px; }
      .hero h1 { font-size: 28px; line-height: 36px; letter-spacing: -0.01em; }
      .hero .ctas {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
      }
      .hero .ctas > * { width: 100% !important; }

      /* All pill buttons on mobile: 48 px tall, 14 px label, full-width edge-to-edge.
         Button.jsx writes height + font inline, so !important is required.
         Targets primary / secondary / ghost (md / lg) pills — NOT the underlined
         inline `text` accent, which lives inside sentences and stays inline. */
      .hero .ctas > button,
      .hero .ctas > a,
      .cases-more > button,
      .cases-more > a,
      .contacts-buttons > button,
      .contacts-buttons > a,
      .menu-cta-row > button,
      .menu-cta-row > a {
        height: 48px !important;
        width: 100% !important;
        font: 500 14px/22px var(--font-body) !important;
      }
      .cases-more { align-self: stretch; }

      /* ------------------------------------------------------------
         Mobile body scale per design spec:
           Body Lg → Inter 400, 14 / 22  (desktop 20 / 28 — hero sub, .body-lg)
           Body    → Inter 400, 13 / 20  (desktop 18 / 26 — paragraphs, inline copy)
         Targets both className-based callers and inline `font:` shorthand
         strings written by JSX components via [style*="…"] selectors. */
      .hero p.sub,
      .body-lg,
      main [style*="20px/28px"]:not(button):not(a) {
        font: 400 14px/22px var(--font-body) !important;
      }
      main p:not(.sub),
      .body,
      main [style*="18px/26px"] {
        font: 400 13px/20px var(--font-body) !important;
      }

      /* Cases — single column */
      .cases-row-two { grid-template-columns: 1fr; gap: 32px; }
      .cases-heading { flex-direction: column; align-items: flex-start; gap: 16px; }
      .cases-grid { gap: 32px; }

      /* Case card meta — tighter spacing on mobile.
         Image → title: 16 px. Title → tags row: 8 px.
         CaseCard.jsx writes margin-top + gap inline, so !important is required. */
      .case-card-meta {
        margin-top: 16px !important;
        gap: 8px !important;
      }

      /* Tabs (Cases filter chips) on mobile — height 40, label 13/20.
         Tab.jsx writes height + font inline, so !important is required. */
      .case-tab {
        height: 40px !important;
        font: 500 13px/20px var(--font-body) !important;
      }
      /* Tighter spacing between filter chips on mobile (Все · Веб · Мобайл …) */
      .cases-tabs { gap: 8px; justify-content: center; }
      /* Center the Cases section header on mobile: title, tabs, count */
      #Кейсы .section-heading { align-items: center; text-align: center; }
      #Кейсы .cases-heading { flex-direction: column; justify-content: center; align-items: center; }
      /* On mobile reset the desktop/tablet count-first reorder so tabs stay above the count. */
      #Кейсы .cases-count { order: 0; }

      /* Side-nav rail items INSIDE the mobile menu overlay — 14/22.
         Desktop side-rail items are unaffected (this is the sheet variant). */
      .menu-item {
        font: 500 14px/22px var(--font-body) !important;
      }

      /* Square brand/logo image in PositionHeader — 64 → 48 on mobile. */
      .position-logo {
        width: 48px !important;
        height: 48px !important;
      }

      /* Reviews — one card per page on mobile only */
      .reviews-page { grid-template-columns: 1fr; }

      /* Review modal — tighter padding + smaller quote on mobile */
      .review-modal { padding: 16px; }
      .review-modal-panel { padding: 32px 24px; gap: 0; }
      .review-modal-close { top: 16px; right: 16px; }
      .review-modal-quote { font: 400 14px/22px var(--font-body); margin: 0 0 32px; }
      .review-modal-author h3 { font: 400 16px/24px var(--font-display); margin: 0 0 8px; }
      .review-modal-author span { font: 400 13px/20px var(--font-body); }
      .review-readmore { font: 400 14px/22px var(--font-body); }

      /* Reviews footer note scales down on mobile (desktop/tablet = 18/26). */
      .reviews-footer { font: 400 14px/22px var(--font-body) !important; }

      /* Mobile layout for #Отзывы:
         1. title  2. Linked In note  3. cards  4. arrow controls
         .reviews-heading uses display: contents so its h2 + arrows
         participate directly in the section's flex column, and we
         reorder via `order`. */
      #Отзывы { gap: 24px; }
      .reviews-heading { display: contents; }
      .reviews-heading > .title { order: 0; text-align: center; }
      .reviews-footer {
        order: 1;
        display: flex;
        justify-content: center;
        text-align: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .reviews-viewport { order: 2; }
      .reviews-arrows {
        order: 3;
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      /* Item 4 — tighter padding inside review card (24 vs 32 desktop).
         The component writes padding inline, so !important is required. */
      .review-card {
        padding: 24px !important;
        gap: 32px !important;
        min-height: 0 !important;
      }

      /* ============================================================
         Item 5 — inline-link style ("Кейс 4", "Linked In", "Посмотреть",
         "резюме", "+ Показать ещё…") → Inter 400, 14 / 22 on mobile.
         Targets:
           a.inline-link  with inline 18/26      (linked cases, footnote link, reviews row)
           button         with inline underline   (Button accent="text" — always 18/26 now)
         ============================================================ */
      main a.inline-link[style*="18px/26px"],
      main button[style*="text-decoration: underline"][style*="18px/26px"],
      main a[style*="text-decoration: underline"][style*="18px/26px"] {
        font: 400 14px/22px var(--font-body) !important;
      }

      /* ============================================================
         Item 6 — meta text ("Imedia Solutions, Беларусь", "ноябрь 2022 –
         январь 2024", "12 проектов", footnotes, course tags) →
         Inter 400, 13 / 20 on mobile.
         Targets every non-interactive element with inline 16/24, plus
         the class-based .cases-count.
         ============================================================ */
      main [style*="16px/24px"]:not(button):not(a),
      .cases-count {
        font: 400 13px/20px var(--font-body) !important;
      }

      /* Contacts — buttons stack full-width.
         Desktop sets `display: inline-flex` on the container, which shrink-wraps
         to content; we have to switch it to plain flex + width:100% so the
         button stretch (width:100% on each child) resolves against the section. */
      .contacts-buttons {
        display: flex !important;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
      }
      .contacts-buttons > * { width: 100% !important; }

      /* ------------------------------------------------------------
         Mobile type scale per design spec:
           H2 (section titles)               → 28 / 36 medium
           H3 (subsection — "Вышка", company)→ 20 / 28 regular
           H4 (card sub-heads, list items)   → 16 / 24 regular
         Inline `font` shorthand in JSX needs !important to be overridden.
         ------------------------------------------------------------ */
      .title,
      .section-heading h2.title {
        font: 500 28px/36px var(--font-display) !important;
        letter-spacing: -0.01em;
      }
      main h2:not(.title) {
        font: 400 20px/28px var(--font-display) !important;
      }
      main h3 {
        font: 400 16px/24px var(--font-display) !important;
      }

      /* ============================================================
         Mobile vertical-rhythm overrides (per design spec).
         All values here are mobile-only.
         ============================================================ */

      /* --- Бэкграунд ----------------------------------------------
         H2 → description = 24
         description → "Вышка" = 32 (= .section gap, already set)
         end of Вышка col (paragraph) → "Курсы" = 28 (.bg-grid stack gap)
         Inside each bg-col: H2/PositionHeader/CourseEntry stack on 24,
         with dashed dividers trimmed to land 20 on each side. */
      #Бэкграунд > div:first-child { gap: 24px !important; }
      .bg-grid { gap: 28px !important; }
      .bg-col { gap: 24px !important; }
      .bg-col .divider-dashed { margin: -4px 0; }

      /* --- Опыт работы --------------------------------------------
         Section gap: 32 (override the inline 64).
         H2 → description = 24.
         ExperienceEntry vertical layout:
           PositionHeader → "Обязанности…" block = 28
           Within left col: H3 → body = 20, body → reviews row = 20
           Left col → "Связанные кейсы:" (stacked on mobile) = 28
           Within right col: H3 → first linked case = 20
         Between consecutive ExperienceEntry items + flanking
         dashed divider: 32 each side. */
      #Опыт.section { gap: 32px !important; }

  const lockTimer = React.useRef(null);

  // Below 1024 px (tablet + mobile) the reviews carousel shows one card per page;
  // on desktop it shows two side-by-side. Tracked via matchMedia so the page count
  // and active page reset cleanly when the viewport crosses the breakpoint.
  const [isCompact, setIsCompact] = React.useState(
    () => typeof window !== "undefined" && window.matchMedia("(max-width: 727px)").matches
  );
  React.useEffect(() => {
    const mql = window.matchMedia("(max-width: 727px)");
    const onChange = (e) => { setIsCompact(e.matches); setReviewPage(0); };
    mql.addEventListener("change", onChange);
    return () => mql.removeEventListener("change", onChange);
  }, []);

  // Close the menu when the viewport grows past tablet — avoids the
  // overlay being stuck open if the user resizes from mobile to desktop.
  React.useEffect(() => {
    const mql = window.matchMedia("(min-width: 1024px)");
    const onChange = (e) => { if (e.matches) setMenuOpen(false); };
    mql.addEventListener("change", onChange);
    return () => mql.removeEventListener("change", onChange);
  }, []);

  // Scroll-spy: update active nav as user scrolls past section anchors.
  // On desktop (≥1024): "Контакты" activates only when fully visible (IntersectionObserver threshold 1.0)
  // or when the page is scrolled to the very bottom. All other sections use the standard +200px heuristic.
  // On tablet/mobile: all sections use the standard heuristic.
  React.useEffect(() => {
    const ids = ["Я", "Кейсы", "Отзывы", "Бэкграунд", "Опыт", "Контакты"];
    const otherIds = ["Я", "Кейсы", "Отзывы", "Бэкграунд", "Опыт"];

    let contactsFullyVisible = false;
    let observer = null;

    const isDesktop = () => window.innerWidth >= 1024;

    const updateActive = () => {
      if (lockScrollSpy.current) return;
      if (isDesktop()) {
        const atBottom =
          window.scrollY + window.innerHeight >=
          document.documentElement.scrollHeight - 5;
        if (atBottom || contactsFullyVisible) {
          setActiveSection("Контакты");
          return;
        }
        const y = window.scrollY + 200;
        let current = "Я";
        for (const id of otherIds) {
          const el = document.getElementById(id);
          if (el && el.offsetTop <= y) current = id;
        }
        setActiveSection(current);
      } else {
        const y = window.scrollY + 200;
        let current = "Я";
        for (const id of ids) {
          const el = document.getElementById(id);
          if (el && el.offsetTop <= y) current = id;
        }
        setActiveSection(current);
      }
    };

    const setupObserver = () => {
      if (observer) { observer.disconnect(); observer = null; }
      contactsFullyVisible = false;
      if (!isDesktop()) return;
      const contactsEl = document.getElementById("Контакты");
      if (!contactsEl) return;
      observer = new IntersectionObserver(
        ([entry]) => {
          contactsFullyVisible = entry.isIntersecting && entry.intersectionRatio >= 1.0;
          updateActive();
        },
        { threshold: 1.0 }
      );
      observer.observe(contactsEl);
    };

    let resizeTimer = null;
    const onResize = () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        setupObserver();
        updateActive();
      }, 200);
    };

    setupObserver();
    window.addEventListener("scroll", updateActive, { passive: true });
    window.addEventListener("resize", onResize);
    updateActive();

    return () => {
      window.removeEventListener("scroll", updateActive);
      window.removeEventListener("resize", onResize);
      clearTimeout(resizeTimer);
      if (observer) observer.disconnect();
    };
  }, []);

      // smooth scroll doesn't let the spy revert to the section above.
      setActiveSection("Контакты");
      lockScrollSpy.current = true;
      clearTimeout(lockTimer.current);
      lockTimer.current = setTimeout(() => { lockScrollSpy.current = false; }, 1200);

                  </div>

                  {(() => {
                // group cases by adjacency: pair two smalls in a row, big alone.
                const rows = [];

                    rows.push([c]);

                linkedCases={["Кейс 1", "Кейс 2", "Кейс 3"]}

                  <hr className="divider-dashed" />
                  <ExperienceEntry

                linkedCases={["Кейс 1", "Кейс 2"]}
                reviews={["1 отзыв руководителя", "2 отзыва коллег"]} />
              
                  <hr className="divider-dashed" />
                  <ExperienceEntry
                title="Middle UX/UI designer"

                year="ноябрь 2022 – январь 2024"
                body={"Проектировала веб- и мобильные интерфейсы: корпоративные сайты, интернет-магазины, лендинги, сайты-визитки, SaaS, CRM-системы и мобильные приложения. Проектировала с нуля и дорабатывала дизайн-системы и UI-киты. Вела несколько проектов параллельно. Презентовала решения клиентам.\n\nЗакрывала задачи по графическому дизайну: брендинг (логотипы, фирменный стиль, брендбуки, оформление аккаунтов в соцсетях). Расширила спектр услуг компании: внедрила 3D-графику и современные визуальные подходы."}
                linkedCases={["Кейс 1", "Кейс 2", "Кейс 3", "Кейс 4"]}
                reviews={["1 отзыв руководителя", "2 отзыва коллег"]} />
              
                  <hr className="divider-dashed" />
                  <Button accent="text" size="sm" style={{ alignSelf: "flex-start" }}>+ Показать еще одно место работы</Button>
                </div>
              </section>

              <hr className="divider-solid" />

              {/* === Контакты — shared component, used on case-detail too === */}
              <Contacts />

            </div>
          </main>

          <ReviewModal review={openReview} onClose={() => setOpenReview(null)} />
        </>);

}
